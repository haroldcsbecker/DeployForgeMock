name: DeployForge Baseline Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Main branch SHA to package (defaults to main)
        required: false
        type: string
      stable_tag:
        description: Deprecated stable tag input; BASE is always published as base-main
        required: false
        default: base-main
        type: string
      package_name:
        description: Container package name without ghcr.io/owner/
        required: false
        default: deployforgemock
        type: string

permissions:
  contents: write
  packages: write

run-name: Baseline package ${{ inputs.source_sha || 'main' }}

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'main' }}
          fetch-depth: 0

      - name: Install runtime dependencies
        run: npm install --no-package-lock
      - name: Validate DeployStrategy
        run: node runtime/validate-strategy-manifest.mjs

      - name: Resolve source
        id: source
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package_name || 'deployforgemock' }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${OWNER,,}/${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=base-main" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push baseline
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}

      - name: Resolve digest
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" | awk '$1=="Digest:" {print $2; exit}')"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish baseline release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          STABLE_TAG: base-main
        run: |
          set -euo pipefail
          TAG="base-main"
          printf '%s\n'             "source_sha=${SOURCE_SHA}"             "artifact_registry=ghcr.io"             "artifact_repository=${IMAGE#ghcr.io/}"             "artifact_digest=${DIGEST}"             "base_tag=${STABLE_TAG}" > baseline-notes.txt
          gh release create "${TAG}"             --target "${SOURCE_SHA}"             --title "DeployForge BASE — Fixed Main Baseline"             --notes-file baseline-notes.txt             || gh release edit "${TAG}"             --title "DeployForge BASE — Fixed Main Baseline"             --notes-file baseline-notes.txt
