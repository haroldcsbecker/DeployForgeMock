name: DeployForge Package Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[deployforge-package-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete container versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE=deployforgemock
          gh api --paginate "/user/packages/container/${PACKAGE}/versions?per_page=100" --jq '.[].id' |
            while read -r id; do
              [ -z "${id}" ] || gh api --method DELETE "/user/packages/container/${PACKAGE}/versions/${id}"
            done
          gh api --method DELETE "/user/packages/container/${PACKAGE}" || true

      - name: Remove package cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/package-cleanup.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/package-cleanup.yml"             -f message="Remove temporary package cleanup workflow"             -f sha="${sha}"             -f branch="main"
