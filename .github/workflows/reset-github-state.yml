name: DeployForge GitHub BASE Reset

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Container package name
        required: true
        default: deployforgemock
        type: string
      base_tag:
        description: Fixed BASE tag
        required: true
        default: base-main
        type: string

permissions:
  contents: write
  packages: write

run-name: Reset GitHub state to BASE

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve BASE
        id: base
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fixed BASE image
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package_name }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${PACKAGE}"
          docker build -t "${image}:${BASE_TAG}" .
          docker push "${image}:${BASE_TAG}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Remove old package versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package_name }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          versions="$(gh api --paginate "/users/${owner}/packages/container/${PACKAGE}/versions?per_page=100")"
          base_id="$(printf '%s' "${versions}" | jq -r --arg tag "${BASE_TAG}" '
            .[]
            | select((.metadata.container.tags // []) | index($tag))
            | .id
          ' | head -n 1)"

          if [ -z "${base_id}" ] || [ "${base_id}" = "null" ]; then
            echo "Could not identify BASE package version after push."
            exit 1
          fi

          printf '%s' "${versions}" | jq -r '.[].id' |
            while IFS= read -r version_id; do
              [ -z "${version_id}" ] && continue
              [ "${version_id}" = "${base_id}" ] && continue
              echo "Deleting package version ${version_id}"
              gh api --method DELETE "/users/${owner}/packages/container/${PACKAGE}/versions/${version_id}"
            done

      - name: Remove old releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              [ -z "${tag}" ] && continue
              [ "${tag}" = "${BASE_TAG}" ] && continue
              echo "Deleting release ${tag}"
              gh release delete "${tag}" --cleanup-tag --yes
            done

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" --jq '.[].ref' |
            sed 's#refs/tags/##' |
            while IFS= read -r tag; do
              [ -z "${tag}" ] && continue
              [ "${tag}" = "${BASE_TAG}" ] && continue
              case "${tag}" in
                release-*|baseline-*|candidate-*|dirty-*)
                  echo "Deleting tag ${tag}"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null
                  ;;
              esac
            done

      - name: Publish fixed BASE release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_TAG: ${{ inputs.base_tag }}
          SHA: ${{ steps.base.outputs.sha }}
          SHORT_SHA: ${{ steps.base.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release create "${BASE_TAG}" \
            --target "${SHA}" \
            --title "DeployForge BASE — Fixed Main Baseline" \
            --notes "Permanent DeployForge rollback root.

Source commit: ${SHA}
Source short SHA: ${SHORT_SHA}
Tag: ${BASE_TAG}

Use the normal QA rejection path for ordinary recovery. This BASE release is the emergency restart point."

      - name: Summary
        run: |
          echo "GitHub BASE reset complete."
          echo "Release: ${{ inputs.base_tag }}"
          echo "Commit: ${{ steps.base.outputs.sha }}"
