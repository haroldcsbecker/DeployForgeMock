name: Reset DeployForge GitHub State

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: GHCR container package name without namespace or registry
        required: false
        default: deployforgemock
        type: string
      base_tag:
        description: Fixed base package and release tag
        required: false
        default: base-main
        type: string

permissions:
  contents: write
  packages: write

run-name: Reset GitHub state to BASE

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve BASE commit
        id: base
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Delete existing DeployForge releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Delete orphaned DeployForge artifact tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" --jq '.[].ref' |
            sed 's#refs/tags/##' |
            while IFS= read -r tag; do
              case "$tag" in
                release-*|baseline-*|candidate-*|dirty-*|${{ inputs.base_tag }})
                  echo "Deleting tag $tag"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null || true
                  ;;
              esac
            done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fixed BASE package
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package_name || 'deployforgemock' }}
          BASE_TAG: ${{ inputs.base_tag || 'base-main' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/${PACKAGE}"
          docker build -t "${IMAGE}:${BASE_TAG}" .
          docker push "${IMAGE}:${BASE_TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Remove old GHCR package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package_name || 'deployforgemock' }}
          BASE_TAG: ${{ inputs.base_tag || 'base-main' }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          BASE_ID="$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100"             --jq '.[] | select(.metadata.container.tags | index(env.BASE_TAG)) | .id' | head -n 1 || true)"

          if [ -z "${BASE_ID}" ]; then
            echo "Unable to identify the new BASE package version."
            echo "The workflow will not delete existing package versions."
            exit 1
          fi

          gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100"             --jq '.[] | .id' |
            while IFS= read -r version_id; do
              [ -z "${version_id}" ] && continue
              if [ "${version_id}" = "${BASE_ID}" ]; then
                continue
              fi
              echo "Deleting package version ${version_id}"
              gh api --method DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}" >/dev/null
            done

      - name: Publish fixed BASE GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_TAG: ${{ inputs.base_tag || 'base-main' }}
          SHA: ${{ steps.base.outputs.sha }}
          SHORT_SHA: ${{ steps.base.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release create "${BASE_TAG}"             --target "${SHA}"             --title "DeployForge BASE — Fixed Main Baseline"             --notes "Fixed DeployForge rollback root.

Source commit: ${SHA}
Source short SHA: ${SHORT_SHA}
Tag: ${BASE_TAG}

This release is the permanent emergency rollback point. Normal QA recovery should reject the HMG candidate rather than use this emergency reset."

      - name: Summary
        run: |
          echo "BASE reset complete."
          echo "Release: ${{ inputs.base_tag || 'base-main' }}"
          echo "Commit: ${{ steps.base.outputs.sha }}"
