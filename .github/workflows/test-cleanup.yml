name: DeployForge Cleanup Test State

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[deployforge-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json number --jq '.[].number' |
            while read -r number; do
              [ -z "${number}" ] || gh pr close "${number}"
            done

      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [ -z "${tag}" ] || gh release delete "${tag}" --yes --cleanup-tag
            done
          git fetch --tags origin --quiet
          git tag -l |
            while read -r tag; do
              [ -z "${tag}" ] || git push origin --delete "refs/tags/${tag}" || true
            done

      - name: Remove cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/test-cleanup.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/test-cleanup.yml"             -f message="Remove temporary cleanup workflow"             -f sha="${SHA}"             -f branch="main"
