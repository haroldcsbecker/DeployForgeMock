name: Mock project tests

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Start GO Feature Flag
        run: docker compose up -d go-feature-flag
      - name: Wait for GO Feature Flag
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:1031/openfeature/v0/manifest >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs go-feature-flag
          exit 1
      - id: tests
        run: npm test
      - name: Stop GO Feature Flag
        if: always()
        run: docker compose down -v
      - name: Publish DeployForge CI status
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api             --method POST             "/repos/${{ github.repository }}/statuses/${SHA}"             -f state="${RESULT}"             -f context="deployforge/ci"             -f description="DeployForge mock CI"
