name: Mock project tests

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: tests
        run: npm test
      - name: Publish DeployForge CI status
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${RESULT}" \
            -f context="deployforge/ci" \
            -f description="DeployForge mock CI"
