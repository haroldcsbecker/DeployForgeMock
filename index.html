<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeployForge Mock</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">DeployForge Mock</p>
        <h1 id="environment">ENV</h1>
        <p id="feature">Feature: loading…</p>
        <div class="counter">
          <button id="decrement" type="button">−</button>
          <strong id="count">0</strong>
          <button id="increment" type="button">+</button>
        </div>

        <div class="meta">
          <span>Version</span>
          <strong id="version">loading…</strong>
        </div>
        <div class="meta">
          <span>Runtime flag provider</span>
          <strong>GO Feature Flag / OpenFeature</strong>
        </div>
        <div class="meta">
          <span>Checkout evaluation</span>
          <strong id="checkout-evaluation">loading…</strong>
        </div>
        <div class="meta">
          <span>Payment evaluation</span>
          <strong id="payment-evaluation">loading…</strong>
        </div>
        <div class="meta">
          <span>Fraud evaluation</span>
          <strong id="fraud-evaluation">loading…</strong>
        </div>
        <div class="meta">
          <span>Build</span>
          <strong id="build">loading…</strong>
        </div>
      </section>
    </main>

    <script>
      const state = { count: 0 };

      async function loadRuntimeMetadata() {
        const response = await fetch("/deployforge-runtime.json", { cache: "no-store" });
        if (!response.ok) throw new Error("runtime metadata unavailable");
        const metadata = await response.json();
        document.querySelector("#environment").textContent = String(metadata.environment || "ENV");
        document.querySelector("#version").textContent = String(metadata.version || "unknown");
        document.querySelector("#build").textContent = String(metadata.build || "unknown");
        document.body.dataset.environment = String(metadata.environment || "env").toLowerCase();
        document.querySelector("#feature").textContent =
          "Feature: " + String(metadata.feature || "Deployment artifact");
      }

      async function loadApplicationEvaluation() {
        try {
          const response = await fetch("/api/checkout", { cache: "no-store" });
          if (!response.ok) throw new Error("checkout unavailable");
          const payload = await response.json();
          document.querySelector("#checkout-evaluation").textContent =
            String(payload.order?.checkout?.implementationId || "unknown");
          document.querySelector("#payment-evaluation").textContent =
            String(payload.order?.payment?.implementationId || "unknown");
          document.querySelector("#fraud-evaluation").textContent =
            String(payload.order?.payment?.fraudImplementationId || "unknown");
        } catch {
          document.querySelector("#checkout-evaluation").textContent = "unavailable";
          document.querySelector("#payment-evaluation").textContent = "unavailable";
          document.querySelector("#fraud-evaluation").textContent = "unavailable";
        }
      }

      const render = () => {
        document.querySelector("#count").textContent = state.count;
      };

      document.querySelector("#increment").addEventListener("click", () => {
        state.count += 1;
        render();
      });

      document.querySelector("#decrement").addEventListener("click", () => {
        state.count -= 1;
        render();
      });

      void Promise.all([
        loadRuntimeMetadata(),
        loadApplicationEvaluation(),
      ]).catch(() => {});

      render();
    </script>
  </body>
</html>
