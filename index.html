<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeployForge Mock</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">DeployForge Mock</p>
        <h1 id="environment">ENV</h1>
        <p id="feature">Feature: loading…</p>

        <div class="counter">
          <button id="decrement" type="button">−</button>
          <strong id="count">0</strong>
          <button id="increment" type="button">+</button>
        </div>

        <div class="meta">
          <span>Version</span>
          <strong id="version">loading…</strong>
        </div>
        <div class="meta">
          <span>Build</span>
          <strong id="build">loading…</strong>
        </div>
      </section>
    </main>

    <script>
      async function loadRuntimeMetadata() {
        const response = await fetch("/deployforge-runtime.json", { cache: "no-store" });
        if (!response.ok) throw new Error("runtime metadata unavailable");

        const metadata = await response.json();
        const environment = String(metadata.environment || "ENV");
        const feature = String(metadata.feature || "Deployment artifact");
        const version = String(metadata.version || "unknown");
        const build = String(metadata.build || "unknown");

        document.querySelector("#environment").textContent = environment;
        document.querySelector("#feature").textContent = "Feature: " + feature;
        document.querySelector("#version").textContent = version;
        document.querySelector("#build").textContent = build;
        document.body.dataset.environment = environment.toLowerCase();
      }

      void loadRuntimeMetadata().catch(() => {
        document.querySelector("#feature").textContent = "Feature: unavailable";
        document.querySelector("#version").textContent = "unavailable";
        document.querySelector("#build").textContent = "unavailable";
      });

      const countElement = document.querySelector("#count");
      let count = 0;

      const render = () => {
        countElement.textContent = count;
      };

      document.querySelector("#increment").addEventListener("click", () => {
        count += 1;
        render();
      });

      document.querySelector("#decrement").addEventListener("click", () => {
        count -= 1;
        render();
      });

      render();
    </script>
  </body>
</html>
